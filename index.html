<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef1f5">
<title>NAFL Timer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --ink: #0f1419;
    --muted: #64748b;
    --line: #d9dee6;
    --home: #0f6fd1;
    --home-soft: #e7f1fc;
    --away: #d4550a;
    --away-soft: #fdeee4;
    --start: #15803d;
    --start-hover: #166534;
    --pause: #b45309;
    --pause-hover: #92400e;
    --danger: #b91c1c;
    --flash: #e11d48;
    --radius: clamp(10px, 1.4vmin, 20px);
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .05);
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  [hidden] {
    display: none !important;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .board {
    --font-scale: 1;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: clamp(8px, 1.2vmin, 18px);
    height: 100vh;
    height: 100dvh;
    padding: clamp(10px, 1.6vmin, 26px);
    overflow: hidden;
  }

  .board.size-m {
    --font-scale: .85;
  }

  .board.size-xl {
    --font-scale: 1.15;
  }

  .scoreboard {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.75fr) minmax(0, 1fr);
    gap: clamp(8px, 1.4vmin, 20px);
    min-height: 0;
  }

  .scoreboard > .team.home {
    grid-row: 1;
    grid-column: 1;
  }

  .scoreboard > .center {
    grid-row: 1;
    grid-column: 2;
  }

  .scoreboard > .team.away {
    grid-row: 1;
    grid-column: 3;
  }

  .board.swapped .scoreboard > .team.home {
    grid-column: 3;
  }

  .board.swapped .scoreboard > .team.away {
    grid-column: 1;
  }

  .panel {
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .team {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 0;
    overflow: hidden;
  }

  .team.home {
    --team: var(--home);
    --team-soft: var(--home-soft);
  }

  .team.away {
    --team: var(--away);
    --team-soft: var(--away-soft);
  }

  .team-bar {
    display: flex;
    flex: none;
    align-items: center;
    justify-content: flex-end;
    width: 100%;
    height: clamp(26px, 3.8vmin, 40px);
    padding: 0 clamp(6px, 1vmin, 14px);
    background: var(--team);
  }

  .team-color {
    width: clamp(1.5rem, 2.6vmin, 2.2rem);
    height: clamp(1.5rem, 2.6vmin, 2.2rem);
    padding: 0;
    border: 2px solid rgba(255, 255, 255, .9);
    border-radius: 50%;
    background: transparent;
    box-shadow: 0 1px 4px rgba(15, 23, 42, .22);
    cursor: pointer;
    appearance: none;
  }

  .team-color::-webkit-color-swatch-wrapper {
    padding: 0;
  }

  .team-color::-webkit-color-swatch {
    border: 0;
    border-radius: 50%;
  }

  .team-color::-moz-color-swatch {
    border: 0;
    border-radius: 50%;
  }

  .team-color:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .team-body {
    position: relative;
    display: grid;
    flex: 1;
    grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
    justify-items: center;
    align-items: center;
    gap: clamp(4px, 1.1vmin, 14px);
    min-height: 0;
    padding: clamp(8px, 1.2vmin, 20px);
  }

  .team-name {
    display: block;
    grid-row: 1;
    align-self: end;
    width: 100%;
    min-width: 0;
    padding: .06em .22em;
    border: 2px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font);
    font-size: clamp(calc(1.4rem * var(--font-scale)), calc(6vmin * var(--font-scale)), calc(5rem * var(--font-scale)));
    font-weight: 700;
    line-height: 1.1;
    text-align: center;
    overflow: hidden;
    resize: none;
    transition: border-color .12s, background-color .12s;
  }

  .team-name:focus {
    outline: none;
    border-color: var(--team);
    background: var(--team-soft);
  }

  .score-stack {
    display: flex;
    grid-row: 2;
    flex-direction: column;
    align-items: center;
    gap: clamp(2px, .8vmin, 10px);
    min-width: 0;
  }

  .score-cell {
    display: flex;
    flex: none;
    align-items: center;
    justify-content: center;
    min-height: 0;
    color: var(--ink);
  }

  .score {
    padding: 0 .02em;
    border: 0;
    border-radius: .08em;
    background: transparent;
    color: inherit;
    font-family: var(--font);
    font-size: clamp(calc(4.5rem * var(--font-scale)), calc(26vmin * var(--font-scale)), calc(30rem * var(--font-scale)));
    font-weight: 800;
    line-height: .85;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: -.03em;
    text-align: center;
    cursor: text;
    overflow: hidden;
  }

  .score.is-three {
    font-size: clamp(calc(3.5rem * var(--font-scale)), calc(21.5vmin * var(--font-scale)), calc(24rem * var(--font-scale)));
  }

  .score:hover {
    background: var(--team-soft);
  }

  .score-input {
    width: 1.32em;
    padding: 0;
    border: 0;
    border-bottom: 2px solid var(--team);
    border-radius: 8px 8px 0 0;
    background: var(--team-soft);
    color: inherit;
    font-family: var(--font);
    font-size: clamp(calc(4.5rem * var(--font-scale)), calc(26vmin * var(--font-scale)), calc(30rem * var(--font-scale)));
    font-weight: 800;
    line-height: .85;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: -.03em;
    text-align: center;
  }

  .score-input.is-three {
    width: 1.9em;
    font-size: clamp(calc(3.5rem * var(--font-scale)), calc(21.5vmin * var(--font-scale)), calc(24rem * var(--font-scale)));
  }

  .score-input:focus {
    outline: none;
  }

  .score-actions {
    position: absolute;
    right: 0;
    bottom: clamp(4px, .9vmin, 14px);
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.2vmin, 28px);
    opacity: .32;
    transition: opacity .15s;
  }

  .score-actions:hover,
  .score-actions:focus-within {
    opacity: 1;
  }

  .step {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: clamp(2rem, 4.6vmin, 4rem);
    height: clamp(2rem, 4.6vmin, 4rem);
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--panel-2);
    color: var(--team);
    font-family: var(--font);
    font-size: clamp(1.1rem, 2.8vmin, 2.2rem);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    transition: background-color .12s, border-color .12s, transform .06s;
  }

  .step:hover:not(:disabled) {
    border-color: var(--team);
    background: var(--team-soft);
  }

  .step:active:not(:disabled) {
    transform: scale(.94);
  }

  .step:disabled {
    opacity: .35;
    cursor: default;
  }

  .clock-step,
  .period-step {
    width: clamp(1.7rem, 3.4vmin, 2.6rem);
    height: clamp(1.7rem, 3.4vmin, 2.6rem);
    color: var(--muted);
    font-size: clamp(.9rem, 1.8vmin, 1.4rem);
  }

  .clock-step:hover:not(:disabled),
  .period-step:hover:not(:disabled) {
    border-color: var(--muted);
    background: var(--panel-2);
    color: var(--ink);
  }

  .center {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2px, .7vmin, 10px);
    padding: clamp(2px, .4vmin, 20px);
    overflow: hidden;
  }

  .clock {
    color: var(--ink);
    font-family: var(--font);
    font-size: clamp(calc(4.5rem * var(--font-scale)), calc(32vmin * var(--font-scale)), calc(26rem * var(--font-scale)));
    font-weight: 800;
    line-height: .9;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: -.035em;
    white-space: nowrap;
    transform-origin: center;
    transition: transform .18s ease;
  }

  .clock.is-wide {
    transform: scaleX(.85);
  }

  .clock.is-editable {
    cursor: pointer;
  }

  .clock-edit {
    position: absolute;
    top: clamp(2px, .4vmin, 20px);
    right: 0;
    left: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.2vmin, 12px);
    min-height: clamp(1.5rem, 3.2vmin, 2.4rem);
  }

  .clock-input {
    width: 10ch;
    padding: .15em .35em;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: var(--font);
    font-size: clamp(.8rem, 1.7vmin, 1.15rem);
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    letter-spacing: .04em;
    text-transform: uppercase;
    transition: border-color .12s, background-color .12s, color .12s;
  }

  .clock-input::placeholder {
    color: var(--muted);
    opacity: .75;
  }

  .clock-input:hover {
    border-color: var(--line);
  }

  .clock-input:focus {
    outline: none;
    border-color: var(--home);
    background: var(--home-soft);
    color: var(--ink);
  }

  .period {
    padding: .06em .3em;
    border: 2px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-family: var(--font);
    font-size: clamp(calc(1.25rem * var(--font-scale)), calc(4.2vmin * var(--font-scale)), calc(3.4rem * var(--font-scale)));
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .12s, color .12s, border-color .12s;
  }

  .period:hover:not(:disabled) {
    background: var(--panel-2);
    color: var(--ink);
  }

  .period:disabled {
    cursor: default;
  }

  .period:focus-visible {
    outline: 2px solid var(--home);
    outline-offset: 2px;
  }

  .period-edit {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.2vmin, 12px);
    min-height: clamp(2rem, 5vmin, 4.2rem);
  }

  .period-input {
    width: 5.5ch;
    padding: .06em .3em;
    border: 0;
    border-bottom: 2px solid var(--home);
    border-radius: 10px 10px 0 0;
    background: var(--home-soft);
    color: var(--ink);
    font-family: var(--font);
    font-size: clamp(calc(1.25rem * var(--font-scale)), calc(4.2vmin * var(--font-scale)), calc(3.4rem * var(--font-scale)));
    font-weight: 700;
    line-height: 1.15;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: .04em;
    text-align: center;
  }

  .period-input:focus {
    outline: none;
  }

  .controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: clamp(6px, 1vmin, 14px);
    padding: clamp(8px, 1.2vmin, 16px) clamp(10px, 1.6vmin, 22px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .controls-side {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(3px, .7vmin, 7px);
    min-width: 0;
  }

  .controls-side.right {
    align-items: flex-end;
    justify-self: end;
  }

  .controls-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: clamp(6px, 1vmin, 14px);
    min-width: 0;
  }

  .controls-side.right .controls-group {
    justify-content: flex-end;
  }

  .btn {
    appearance: none;
    padding: clamp(.45rem, 1vmin, .75rem) clamp(.7rem, 1.6vmin, 1.2rem);
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--ink);
    font-family: var(--font);
    font-size: clamp(.78rem, 1.6vmin, 1.05rem);
    font-weight: 600;
    line-height: 1.1;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .12s, border-color .12s, color .12s, transform .06s;
  }

  .btn:hover:not(:disabled) {
    border-color: var(--muted);
    background: var(--panel);
  }

  .btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: .42;
    cursor: not-allowed;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5em;
    min-width: clamp(8rem, 14vmin, 11rem);
    padding-block: clamp(.55rem, 1.2vmin, .9rem);
    border: 0;
    background: var(--start);
    color: #ffffff;
    font-size: clamp(.95rem, 2vmin, 1.35rem);
    font-weight: 800;
    letter-spacing: .02em;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .08);
  }

  .icon {
    display: block;
    flex: none;
    width: 1.15em;
    height: 1.15em;
    fill: currentColor;
  }

  .pause-icon {
    display: none;
  }

  .sound-wave,
  .sound-off {
    fill: none;
  }

  .toggle.is-running .play-icon {
    display: none;
  }

  .toggle.is-running .pause-icon {
    display: block;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
    padding: clamp(.45rem, 1vmin, .7rem);
  }

  .icon-btn .icon {
    width: 1.35em;
    height: 1.35em;
  }

  #muteBtn .sound-off {
    opacity: 0;
    transition: opacity .12s;
  }

  #muteBtn[aria-pressed="true"] .sound-off {
    opacity: 1;
  }

  #muteBtn[aria-pressed="true"] .sound-wave {
    opacity: 0;
  }

  #muteBtn .sound-wave {
    transition: opacity .12s;
  }

  .toggle:hover:not(:disabled) {
    background: var(--start-hover);
  }

  .toggle.is-running {
    background: var(--pause);
  }

  .toggle.is-running:hover:not(:disabled) {
    background: var(--pause-hover);
  }

  .btn.danger {
    border-color: #f0c9c9;
    background: #fff7f7;
    color: var(--danger);
  }

  .btn.danger:hover:not(:disabled) {
    border-color: var(--danger);
    background: #ffecec;
  }

  .btn[aria-pressed="true"] {
    border-color: #f0c9c9;
    background: #fff7f7;
    color: var(--danger);
  }

  #namesBtn[aria-pressed="true"],
  #swapBtn[aria-pressed="true"] {
    border-color: var(--line);
    background: var(--bg);
    color: var(--ink);
  }

  .size-group {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }

  .size-btn {
    min-width: clamp(1.9rem, 3.4vmin, 2.6rem);
    padding-inline: .45em;
  }

  .size-group .size-btn[aria-pressed="true"] {
    border-color: var(--home);
    background: var(--home-soft);
    color: var(--home);
  }

  .config {
    display: flex;
    align-items: flex-end;
    gap: clamp(6px, 1vmin, 14px);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    color: var(--muted);
    font-family: var(--font);
    font-size: clamp(.62rem, 1.2vmin, .8rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .field input {
    width: 6.5ch;
    padding: clamp(.45rem, 1vmin, .75rem) .45em;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #ffffff;
    color: var(--ink);
    font-family: var(--font);
    font-size: clamp(.78rem, 1.6vmin, 1.05rem);
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums lining-nums;
    text-align: center;
    appearance: textfield;
  }

  .field input:focus {
    outline: none;
    border-color: var(--home);
    box-shadow: 0 0 0 3px rgba(15, 111, 209, .15);
  }

  :focus-visible {
    outline: 2px solid var(--home);
    outline-offset: 2px;
  }

  .team-name:focus-visible,
  .score-input:focus-visible,
  .clock-input:focus-visible,
  .field input:focus-visible {
    outline: none;
  }

  @keyframes flashPulse {
    0%, 100% { color: var(--ink); }
    15%, 45%, 75% { color: var(--flash); }
    30%, 60%, 90% { color: var(--ink); }
  }

  .flash {
    animation: flashPulse 1.15s ease-in-out 1;
  }

  @media (max-width: 640px) {
    .board {
      gap: clamp(6px, 1.6vmin, 14px);
      padding: clamp(8px, 2vmin, 18px);
    }

    .scoreboard {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas:
        "home away"
        "center center";
      gap: clamp(6px, 1.6vmin, 12px);
    }

    .scoreboard > .team.home {
      grid-area: home;
    }

    .board.swapped .scoreboard > .team.home {
      grid-area: away;
    }

    .scoreboard > .team.away {
      grid-area: away;
    }

    .board.swapped .scoreboard > .team.away {
      grid-area: home;
    }

    .scoreboard > .center {
      grid-area: center;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1.4vmin, 12px);
      padding: clamp(6px, 1.2vmin, 12px) clamp(8px, 1.4vmin, 16px);
    }

    .controls-side,
    .controls-side.right {
      align-items: center;
    }

    .controls-group,
    .controls-side.right .controls-group {
      justify-content: center;
    }

    .toggle {
      order: -1;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn,
    .step,
    .team-name,
    .clock-input {
      transition: none;
    }
  }
</style>
</head>
<body>
<main class="board" id="board">
  <div class="scoreboard">
    <section class="panel team home" aria-label="Home team">
      <div class="team-bar">
        <input class="team-color" id="homeColor" type="color" value="#0f6fd1" aria-label="Home team color" title="Change home team color">
      </div>
      <div class="team-body">
        <label class="sr-only" for="homeName">Home team name</label>
        <textarea class="team-name" id="homeName" rows="1" maxlength="24" autocomplete="off" spellcheck="false"></textarea>
        <div class="score-stack">
          <div class="score-cell" data-flash>
            <button class="score" id="homeScore" type="button" aria-label="Home score">0</button>
            <input class="score-input" id="homeScoreInput" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Edit home score" hidden>
          </div>
          <div class="score-actions">
            <button class="step" type="button" data-team="home" data-delta="-1" aria-label="Decrease home score">&minus;</button>
            <button class="step" type="button" data-team="home" data-delta="1" aria-label="Increase home score">+</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel center" aria-label="Clock">
      <div class="clock-edit">
        <button class="step clock-step" id="timeMinus" type="button" aria-label="Decrease time by one second">&minus;</button>
        <label class="sr-only" for="clockInput">Set elapsed time in minutes and seconds</label>
        <input class="clock-input" id="clockInput" type="text" inputmode="numeric" placeholder="Set time" autocomplete="off" spellcheck="false">
        <button class="step clock-step" id="timePlus" type="button" aria-label="Increase time by one second">+</button>
      </div>
      <div class="clock" id="clock" data-flash role="timer" aria-live="off" aria-label="Elapsed time">0:00</div>
      <div class="period-edit">
        <button class="step period-step" id="periodMinus" type="button" aria-label="Previous period">&minus;</button>
        <label class="sr-only" for="periodInput">Set current period and total periods, e.g. 2 or 2 / 3</label>
        <button class="period" id="periodLabel" type="button">Period 1 / 2</button>
        <input class="period-input" id="periodInput" type="text" inputmode="numeric" maxlength="9" autocomplete="off" spellcheck="false" hidden>
        <button class="step period-step" id="periodPlus" type="button" aria-label="Next period">+</button>
      </div>
    </section>

    <section class="panel team away" aria-label="Away team">
      <div class="team-bar">
        <input class="team-color" id="awayColor" type="color" value="#d4550a" aria-label="Away team color" title="Change away team color">
      </div>
      <div class="team-body">
        <label class="sr-only" for="awayName">Away team name</label>
        <textarea class="team-name" id="awayName" rows="1" maxlength="24" autocomplete="off" spellcheck="false"></textarea>
        <div class="score-stack">
          <div class="score-cell" data-flash>
            <button class="score" id="awayScore" type="button" aria-label="Away score">0</button>
            <input class="score-input" id="awayScoreInput" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Edit away score" hidden>
          </div>
          <div class="score-actions">
            <button class="step" type="button" data-team="away" data-delta="-1" aria-label="Decrease away score">&minus;</button>
            <button class="step" type="button" data-team="away" data-delta="1" aria-label="Increase away score">+</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <section class="controls" aria-label="Controls">
    <div class="controls-side">
      <div class="controls-group">
        <button class="btn" id="namesBtn" type="button" aria-pressed="false">Hide names</button>
        <button class="btn icon-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h3.2L12 5v14l-4.8-4H4z"></path>
            <path class="sound-wave" d="M15.5 8.6a5 5 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path class="sound-wave" d="M18.2 6.2a8.4 8.4 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path class="sound-off" d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
        <div class="size-group" role="group" aria-label="Scoreboard font size">
          <button class="btn size-btn" type="button" data-size="m" aria-pressed="false">M</button>
          <button class="btn size-btn" type="button" data-size="l" aria-pressed="true">L</button>
          <button class="btn size-btn" type="button" data-size="xl" aria-pressed="false">XL</button>
        </div>
        <button class="btn icon-btn" id="swapBtn" type="button" aria-pressed="false" aria-label="Swap home and away sides" title="Swap home and away sides">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h14M15 5l3 3-3 3M20 16H6M9 13l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </div>
    <button class="btn toggle" id="toggleBtn" type="button" aria-label="Start clock">
      <svg class="icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      <svg class="icon pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7z"></path><path d="M13 5h4v14h-4z"></path></svg>
      <span id="toggleLabel">Start</span>
    </button>
    <div class="controls-side right">
      <div class="controls-group">
        <div class="config">
          <label class="field length" for="lengthInput">
            <span class="sr-only">Period length</span>
            <input id="lengthInput" type="text" inputmode="numeric" placeholder="MM:SS" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <button class="btn danger" id="newBtn" type="button">New game</button>
      </div>
    </div>
  </section>
</main>
<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'nafl-timer:v1';
  const MIN_PERIOD_MS = 30000;
  const MAX_PERIOD_MS = 3600000;
  const MAX_SCORE = 999;
  const FLASH_MS = 1200;
  const DEFAULT_HOME_COLOR = '#0f6fd1';
  const DEFAULT_AWAY_COLOR = '#d4550a';
  const FONT_SIZES = ['m', 'l', 'xl'];

  const byId = (id) => document.getElementById(id);

  const els = {
    board: byId('board'),
    homeName: byId('homeName'),
    awayName: byId('awayName'),
    homeScore: byId('homeScore'),
    awayScore: byId('awayScore'),
    homeScoreInput: byId('homeScoreInput'),
    awayScoreInput: byId('awayScoreInput'),
    clock: byId('clock'),
    clockInput: byId('clockInput'),
    timeMinus: byId('timeMinus'),
    timePlus: byId('timePlus'),
    periodLabel: byId('periodLabel'),
    periodInput: byId('periodInput'),
    periodMinus: byId('periodMinus'),
    periodPlus: byId('periodPlus'),
    toggleBtn: byId('toggleBtn'),
    toggleLabel: byId('toggleLabel'),
    homeColor: byId('homeColor'),
    awayColor: byId('awayColor'),
    lengthInput: byId('lengthInput'),
    muteBtn: byId('muteBtn'),
    namesBtn: byId('namesBtn'),
    swapBtn: byId('swapBtn'),
    newBtn: byId('newBtn')
  };

  const sizeButtons = Array.from(document.querySelectorAll('.size-btn'));

  const teams = {
    home: {
      panel: els.homeName.closest('.team'),
      nameInput: els.homeName,
      scoreButton: els.homeScore,
      scoreInput: els.homeScoreInput,
      colorInput: els.homeColor,
      fallback: 'Home',
      fallbackColor: DEFAULT_HOME_COLOR
    },
    away: {
      panel: els.awayName.closest('.team'),
      nameInput: els.awayName,
      scoreButton: els.awayScore,
      scoreInput: els.awayScoreInput,
      colorInput: els.awayColor,
      fallback: 'Away',
      fallbackColor: DEFAULT_AWAY_COLOR
    }
  };

  const defaultState = () => ({
    version: 1,
    home: { name: 'Home', score: 0, color: DEFAULT_HOME_COLOR },
    away: { name: 'Away', score: 0, color: DEFAULT_AWAY_COLOR },
    period: 1,
    elapsedMs: 0,
    periods: 2,
    periodLengthMs: 600000,
    muted: false,
    namesHidden: false,
    size: 'l',
    swapped: false
  });

  let state = defaultState();
  let running = false;
  let startedAt = 0;
  let rafId = 0;
  let editingScore = null;
  let editingPeriod = false;
  let clockDirty = false;
  let flashTimer = 0;
  let audioCtx = null;

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function clampInt(value, min, max, fallback) {
    const number = Number(value);
    if (!Number.isFinite(number)) return fallback;
    return clamp(Math.round(number), min, max);
  }

  function clampNumber(value, min, max, fallback) {
    const number = Number(value);
    if (!Number.isFinite(number)) return fallback;
    return clamp(number, min, max);
  }

  function parseClock(raw) {
    const match = /^\s*(\d{1,3}):([0-5]\d)\s*$/.exec(String(raw));
    if (!match) return null;
    return (Number(match[1]) * 60 + Number(match[2])) * 1000;
  }

  function formatClock(ms) {
    const totalSeconds = Math.floor(clamp(ms, 0, MAX_PERIOD_MS) / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return minutes + ':' + String(seconds).padStart(2, '0');
  }

  function sanitizeColor(value, fallback) {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value)
      ? value.toLowerCase()
      : fallback;
  }

  function sanitizeTeam(raw, fallbackName, fallbackColor) {
    const name = raw && typeof raw.name === 'string'
      ? raw.name.trim().slice(0, 24)
      : '';
    return {
      name: name || fallbackName,
      score: clampInt(raw && raw.score, 0, MAX_SCORE, 0),
      color: sanitizeColor(raw && raw.color, fallbackColor)
    };
  }

  function softenColor(hex) {
    const value = parseInt(hex.slice(1), 16);
    const channels = [(value >> 16) & 255, (value >> 8) & 255, value & 255];
    return '#' + channels
      .map((channel) => Math.round(channel + (255 - channel) * 0.88))
      .map((channel) => channel.toString(16).padStart(2, '0'))
      .join('');
  }

  function sanitizeState(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    if (raw.version !== 1) return null;
    const periods = clampInt(raw.periods, 1, 9, 2);
    const period = clampInt(raw.period, 1, periods, 1);
    const periodLengthMs = clampNumber(raw.periodLengthMs, MIN_PERIOD_MS, MAX_PERIOD_MS, 600000);
    return {
      version: 1,
      home: sanitizeTeam(raw.home, 'Home', DEFAULT_HOME_COLOR),
      away: sanitizeTeam(raw.away, 'Away', DEFAULT_AWAY_COLOR),
      period,
      elapsedMs: clampNumber(raw.elapsedMs, 0, periodLengthMs, 0),
      periods,
      periodLengthMs,
      muted: raw.muted === true,
      namesHidden: raw.namesHidden === true,
      size: FONT_SIZES.includes(raw.size) ? raw.size : 'l',
      swapped: raw.swapped === true
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return sanitizeState(JSON.parse(raw)) || defaultState();
    } catch (error) {
      return defaultState();
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
      return;
    }
  }

  function render() {
    renderTeams();
    renderClock();
    renderControls();
  }

  function renderTeams() {
    Object.keys(teams).forEach((teamKey) => {
      const ui = teams[teamKey];
      const team = state[teamKey];
      if (document.activeElement !== ui.nameInput) {
        ui.nameInput.value = team.name || ui.fallback;
      }
      ui.nameInput.hidden = state.namesHidden;
      ui.panel.style.setProperty('--team', team.color);
      ui.panel.style.setProperty('--team-soft', softenColor(team.color));
      if (document.activeElement !== ui.colorInput) {
        ui.colorInput.value = team.color;
      }
      const editing = editingScore === teamKey;
      ui.scoreButton.hidden = editing;
      ui.scoreInput.hidden = !editing;
      ui.scoreButton.textContent = String(team.score);
      ui.scoreButton.classList.toggle('is-three', String(team.score).length >= 3);
      ui.scoreButton.setAttribute(
        'aria-label',
        (team.name || ui.fallback) + ' score ' + team.score + '. Activate to edit.'
      );
    });
  }

  function renderClock() {
    const clockText = formatClock(state.elapsedMs);
    els.clock.textContent = clockText;
    els.clock.classList.toggle('is-wide', clockText.length > 4);
    els.clock.classList.toggle('is-editable', !running);
    els.clock.title = running ? '' : 'Click to edit time';
    els.clockInput.hidden = running;
    els.timeMinus.hidden = running;
    els.timePlus.hidden = running;
    els.timeMinus.disabled = state.elapsedMs <= 0;
    els.timePlus.disabled = state.elapsedMs >= state.periodLengthMs;
    if (!running && document.activeElement !== els.clockInput) {
      els.clockInput.value = '';
    }
    els.periodLabel.hidden = editingPeriod;
    els.periodInput.hidden = !editingPeriod;
    els.periodMinus.hidden = running || editingPeriod;
    els.periodPlus.hidden = running || editingPeriod;
    els.periodMinus.disabled = running || state.period <= 1;
    els.periodPlus.disabled = running || state.period >= state.periods;
    els.periodLabel.textContent = 'Period ' + state.period + ' / ' + state.periods;
    els.periodLabel.disabled = running;
    els.periodLabel.title = running
      ? 'Pause the clock to edit the period'
      : 'Edit period, e.g. 3 or 3 / 4';
    els.periodLabel.setAttribute(
      'aria-label',
      'Period ' + state.period + ' of ' + state.periods +
        (running ? '. Pause the clock to edit.' : '. Activate to edit.')
    );
  }

  function renderControls() {
    const atLimit = state.elapsedMs >= state.periodLengthMs;
    els.toggleLabel.textContent = running ? 'Pause' : 'Start';
    els.toggleBtn.classList.toggle('is-running', running);
    els.toggleBtn.disabled = !running && atLimit;
    els.toggleBtn.setAttribute('aria-label', running ? 'Pause clock' : 'Start clock');
    els.newBtn.disabled = running;
    if (document.activeElement !== els.lengthInput) {
      els.lengthInput.value = formatClock(state.periodLengthMs);
    }
    const muteLabel = state.muted ? 'Unmute sound' : 'Mute sound';
    els.muteBtn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
    els.muteBtn.setAttribute('aria-label', muteLabel);
    els.muteBtn.title = muteLabel;
    const namesLabel = state.namesHidden ? 'Show names' : 'Hide names';
    els.namesBtn.textContent = namesLabel;
    els.namesBtn.setAttribute('aria-pressed', state.namesHidden ? 'true' : 'false');
    els.namesBtn.setAttribute('aria-label', namesLabel);
    els.namesBtn.title = namesLabel;
    FONT_SIZES.forEach((size) => {
      els.board.classList.toggle('size-' + size, state.size === size);
    });
    sizeButtons.forEach((button) => {
      button.setAttribute(
        'aria-pressed',
        button.dataset.size === state.size ? 'true' : 'false'
      );
    });
    els.board.classList.toggle('swapped', state.swapped);
    els.swapBtn.setAttribute('aria-pressed', state.swapped ? 'true' : 'false');
  }

  function stopTicking() {
    running = false;
    if (rafId) window.cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function captureElapsed() {
    if (running) {
      state.elapsedMs = Math.min(performance.now() - startedAt, state.periodLengthMs);
    }
  }

  function tick() {
    if (!running) return;
    state.elapsedMs = Math.min(performance.now() - startedAt, state.periodLengthMs);
    if (state.elapsedMs >= state.periodLengthMs) {
      finishPeriod();
      return;
    }
    render();
    rafId = window.requestAnimationFrame(tick);
  }

  function startClock() {
    if (running || state.elapsedMs >= state.periodLengthMs) return;
    if (editingPeriod) commitPeriodEdit();
    ensureAudio();
    running = true;
    startedAt = performance.now() - state.elapsedMs;
    if (rafId) window.cancelAnimationFrame(rafId);
    rafId = window.requestAnimationFrame(tick);
    persist();
    render();
  }

  function pauseClock() {
    if (!running) return;
    captureElapsed();
    stopTicking();
    persist();
    render();
  }

  function toggleClock() {
    if (running) {
      pauseClock();
    } else {
      startClock();
    }
  }

  function finishPeriod() {
    state.elapsedMs = state.periodLengthMs;
    stopTicking();
    persist();
    render();
    flashBoard();
    playBeep();
  }

  function confirmPeriodChange(period) {
    return window.confirm(
      'Move to period ' + period + '? The clock will reset to 0:00.'
    );
  }

  function nextPeriod() {
    if (state.period >= state.periods) return;
    if (!confirmPeriodChange(state.period + 1)) {
      render();
      return;
    }
    if (running) {
      captureElapsed();
      stopTicking();
    }
    state.period += 1;
    state.elapsedMs = 0;
    persist();
    render();
  }

  function adjustPeriod(delta) {
    if (running) return;
    const period = clamp(state.period + delta, 1, state.periods);
    if (period === state.period) return;
    if (!confirmPeriodChange(period)) {
      render();
      return;
    }
    state.period = period;
    state.elapsedMs = 0;
    persist();
    render();
  }

  function adjustTime(deltaSeconds) {
    if (running) return;
    const seconds = Math.round(state.elapsedMs / 1000) + deltaSeconds;
    state.elapsedMs = clamp(seconds * 1000, 0, state.periodLengthMs);
    persist();
    render();
  }

  function adjustScore(teamKey, delta) {
    const team = state[teamKey];
    team.score = clamp(team.score + delta, 0, MAX_SCORE);
    persist();
    render();
  }

  function beginScoreEdit(teamKey) {
    editingScore = teamKey;
    render();
    const ui = teams[teamKey];
    ui.scoreInput.value = String(state[teamKey].score);
    ui.scoreInput.classList.toggle('is-three', ui.scoreInput.value.length >= 3);
    ui.scoreInput.focus();
    ui.scoreInput.select();
  }

  function commitScore(teamKey) {
    if (editingScore !== teamKey) return;
    const ui = teams[teamKey];
    const raw = ui.scoreInput.value.trim();
    editingScore = null;
    if (/^\d+$/.test(raw)) {
      state[teamKey].score = clamp(Number(raw), 0, MAX_SCORE);
      persist();
    }
    render();
  }

  function resizeName(input) {
    input.style.height = 'auto';
    const border = input.offsetHeight - input.clientHeight;
    input.style.height = input.scrollHeight + border + 'px';
  }

  function resizeNames() {
    if (state.namesHidden) return;
    Object.keys(teams).forEach((teamKey) => resizeName(teams[teamKey].nameInput));
  }

  function wireName(teamKey) {
    const ui = teams[teamKey];
    const input = ui.nameInput;
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[\r\n]+/g, ' ');
      state[teamKey].name = input.value;
      resizeName(input);
      persist();
    });
    input.addEventListener('blur', () => {
      const name = input.value.trim().slice(0, 24);
      state[teamKey].name = name || ui.fallback;
      input.value = state[teamKey].name;
      persist();
      render();
      resizeName(input);
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        input.blur();
      }
    });
  }

  function beginPeriodEdit() {
    if (running) return;
    editingPeriod = true;
    render();
    els.periodInput.value = state.period + ' / ' + state.periods;
    els.periodInput.focus();
    els.periodInput.select();
  }

  function commitPeriodEdit() {
    if (!editingPeriod) return;
    const raw = els.periodInput.value.trim();
    editingPeriod = false;
    const match = /^(\d{1,2})(?:\s*\/\s*(\d{1,2}))?$/.exec(raw);
    if (match) {
      const period = Number(match[1]);
      const periods = match[2] === undefined
        ? Math.max(state.periods, period)
        : Number(match[2]);
      if (period >= 1 && periods >= 1 && period <= periods && periods <= 9) {
        if (period !== state.period) {
          if (!confirmPeriodChange(period)) {
            render();
            return;
          }
          if (running) stopTicking();
          state.elapsedMs = 0;
        }
        state.period = period;
        state.periods = periods;
        persist();
      }
    }
    render();
  }

  function commitLength() {
    const ms = parseClock(els.lengthInput.value);
    if (ms === null || ms < MIN_PERIOD_MS || ms > MAX_PERIOD_MS) {
      els.lengthInput.value = formatClock(state.periodLengthMs);
      render();
      return;
    }
    const clamped = state.elapsedMs > ms;
    state.periodLengthMs = ms;
    if (clamped) {
      state.elapsedMs = ms;
      stopTicking();
      flashBoard();
    } else if (running && state.elapsedMs >= ms) {
      state.elapsedMs = ms;
      stopTicking();
    }
    persist();
    render();
  }

  function commitClockInput() {
    const raw = els.clockInput.value.trim();
    const apply = clockDirty;
    clockDirty = false;
    els.clockInput.value = '';
    if (apply && raw) {
      const ms = parseClock(raw);
      if (ms !== null && ms <= state.periodLengthMs) {
        state.elapsedMs = ms;
        if (running) {
          if (ms >= state.periodLengthMs) {
            stopTicking();
          } else {
            startedAt = performance.now() - ms;
          }
        }
        persist();
      }
    }
    render();
  }

  function toggleMute() {
    state.muted = !state.muted;
    persist();
    render();
  }

  function toggleNames() {
    state.namesHidden = !state.namesHidden;
    persist();
    render();
    resizeNames();
  }

  function setSize(size) {
    if (!FONT_SIZES.includes(size)) return;
    state.size = size;
    persist();
    render();
    resizeNames();
  }

  function toggleSwap() {
    state.swapped = !state.swapped;
    persist();
    render();
  }

  function newGame() {
    const confirmed = window.confirm('Start a new game? Current score and clock will be lost.');
    if (!confirmed) {
      render();
      return;
    }
    stopTicking();
    if (flashTimer) {
      window.clearTimeout(flashTimer);
      flashTimer = 0;
    }
    document.querySelectorAll('[data-flash]').forEach((element) => {
      element.classList.remove('flash');
    });
    state = defaultState();
    editingScore = null;
    editingPeriod = false;
    clockDirty = false;
    persist();
    render();
    resizeNames();
  }

  function ensureAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      try {
        audioCtx = new AudioContextClass();
      } catch (error) {
        audioCtx = null;
        return null;
      }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playBeep() {
    if (state.muted) return;
    const context = ensureAudio();
    if (!context) return;
    try {
      const now = context.currentTime;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(1, now + 0.012);
      gain.gain.setValueAtTime(1, now + 0.22);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.38);
    } catch (error) {
      return;
    }
  }

  function flashBoard() {
    const targets = document.querySelectorAll('[data-flash]');
    targets.forEach((element) => element.classList.remove('flash'));
    void document.body.offsetWidth;
    targets.forEach((element) => element.classList.add('flash'));
    if (flashTimer) window.clearTimeout(flashTimer);
    flashTimer = window.setTimeout(() => {
      targets.forEach((element) => element.classList.remove('flash'));
      flashTimer = 0;
    }, FLASH_MS);
  }

  els.toggleBtn.addEventListener('click', toggleClock);
  els.periodLabel.addEventListener('click', beginPeriodEdit);
  els.periodMinus.addEventListener('click', () => adjustPeriod(-1));
  els.periodPlus.addEventListener('click', () => adjustPeriod(1));
  els.timeMinus.addEventListener('click', () => adjustTime(-1));
  els.timePlus.addEventListener('click', () => adjustTime(1));
  els.muteBtn.addEventListener('click', toggleMute);
  els.namesBtn.addEventListener('click', toggleNames);
  sizeButtons.forEach((button) => {
    button.addEventListener('click', () => setSize(button.dataset.size));
  });
  els.swapBtn.addEventListener('click', toggleSwap);
  els.newBtn.addEventListener('click', newGame);

  document.querySelectorAll('.step').forEach((button) => {
    button.addEventListener('click', () => {
      adjustScore(button.dataset.team, Number(button.dataset.delta));
    });
  });

  Object.keys(teams).forEach((teamKey) => {
    const ui = teams[teamKey];
    ui.scoreButton.addEventListener('click', () => beginScoreEdit(teamKey));
    ui.scoreInput.addEventListener('blur', () => commitScore(teamKey));
    ui.scoreInput.addEventListener('input', () => {
      ui.scoreInput.classList.toggle('is-three', ui.scoreInput.value.trim().length >= 3);
    });
    ui.scoreInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        ui.scoreInput.blur();
      }
    });
    const applyColor = () => {
      state[teamKey].color = sanitizeColor(ui.colorInput.value, ui.fallbackColor);
      persist();
      render();
    };
    ui.colorInput.addEventListener('input', applyColor);
    ui.colorInput.addEventListener('change', applyColor);
    wireName(teamKey);
  });

  els.clock.addEventListener('click', () => {
    if (running) return;
    els.clockInput.focus();
    els.clockInput.select();
  });

  els.clockInput.addEventListener('focus', () => {
    clockDirty = false;
    els.clockInput.value = formatClock(state.elapsedMs);
    els.clockInput.select();
  });
  els.clockInput.addEventListener('input', () => {
    clockDirty = true;
  });
  els.clockInput.addEventListener('blur', commitClockInput);
  els.clockInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      els.clockInput.blur();
    }
  });

  els.periodInput.addEventListener('blur', commitPeriodEdit);
  els.periodInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      els.periodInput.blur();
    } else if (event.key === 'Escape' || event.key === 'Esc') {
      event.preventDefault();
      editingPeriod = false;
      els.periodInput.blur();
    }
  });

  els.lengthInput.addEventListener('change', commitLength);
  els.lengthInput.addEventListener('blur', commitLength);
  els.lengthInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      els.lengthInput.blur();
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' || event.key === 'Esc') {
      if (document.activeElement instanceof HTMLElement) {
        document.activeElement.blur();
      }
      return;
    }
    const target = event.target;
    const isField = target instanceof HTMLElement && (
      target.tagName === 'INPUT' ||
      target.tagName === 'TEXTAREA' ||
      target.tagName === 'SELECT' ||
      target.isContentEditable
    );
    if (isField) return;
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.repeat) return;
    if (event.code === 'Space' || event.key === ' ') {
      event.preventDefault();
      toggleClock();
    } else if (event.key === 'n' || event.key === 'N') {
      event.preventDefault();
      nextPeriod();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    captureElapsed();
    persist();
  });

  window.addEventListener('beforeunload', () => {
    captureElapsed();
    persist();
  });

  state = loadState();
  running = false;
  startedAt = 0;
  render();
  resizeNames();

  window.addEventListener('resize', resizeNames);
})();
</script>
</body>
</html>
